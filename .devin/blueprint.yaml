# Devin の作業環境定義（リポジトリ単位の blueprint）
# 参考: https://docs.devin.ai/onboard-devin/environment/blueprint-reference
# 変更を main にマージしたら、Devin の Settings > Environment で Sync → Build を実行する。

initialize:
  - name: "Install Node.js"
    uses: github.com/actions/setup-node@v4
    with:
      node-version: "20"

  - name: "Install Python (分析スクリプト用)"
    uses: github.com/actions/setup-python@v5
    with:
      python-version: "3.12"

maintenance:
  - name: "Install server dependencies"
    run: cd 02_scripts/server && npm ci
  - name: "Install extension dependencies"
    run: cd 02_scripts/extension && npm ci

knowledge:
  - name: lint
    contents: |
      02_scripts/server と 02_scripts/extension でそれぞれ `npm run lint`（ESLint＋tsc --noEmit）。

  - name: test
    contents: |
      02_scripts/server と 02_scripts/extension でそれぞれ `npm test`（Vitest）。
      サーバーのテストはメモリDB・モックLLMで動くので外部サービス不要。

  - name: build
    contents: |
      server: `npm run build`（dist/）。ローカル起動は `cp .env.example .env && npm run dev`（http://localhost:8080/admin、ADMIN_DEV_LOGIN=1 で簡易ログイン）。
      extension: `npm run build`、`.vsix` は `npm run package`（dist/research-llm-agent.vsix）。

  - name: database
    contents: |
      本番は Firestore（GCP プロジェクト research-llm-512715）。ローカル・テストは STORE=memory のメモリ実装で、DB のセットアップは不要。

  - name: project
    contents: |
      作業ルール・フォルダ構成は AGENTS.md を参照。
      研究目的・RQ の正本は 00_context/research-questions.md。
      デプロイ・運用は 01_docs/operations-guide.md。
