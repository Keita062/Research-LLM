# Devin の作業環境定義（リポジトリ単位の blueprint）
# 参考: https://docs.devin.ai/onboard-devin/environment/blueprint-reference
# 変更を main にマージしたら、Devin の Settings > Environment で Sync → Build を実行する。
# 技術スタックは設計段階（devin/playbooks/02）で決める。決まったらこのファイルを更新すること。

initialize:
  - name: "Install Node.js"
    uses: github.com/actions/setup-node@v4
    with:
      node-version: "24"

  - name: "Install Python (分析スクリプト用)"
    uses: github.com/actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: "Install PostgreSQL"
    run: |
      sudo apt-get update
      sudo apt-get install -y postgresql postgresql-contrib
      sudo service postgresql start
      sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
      sudo -u postgres psql -tc "SELECT 1 FROM pg_database WHERE datname = 'research_llm'" | grep -q 1 \
        || sudo -u postgres createdb research_llm

maintenance:
  - name: "Install npm dependencies (package.json がある場合のみ)"
    run: if [ -f package.json ]; then npm install; fi

knowledge:
  - name: database
    contents: |
      ローカル開発用の PostgreSQL（postgres:postgres@localhost:5432/research_llm）。
      セッション開始時に起動されていない場合は次を実行する:
        sudo service postgresql start
      DBを使うかどうか・スキーマ管理の方法は設計段階で決める。

  - name: lint
    contents: |
      未整備（2026-10-25 時点でアプリケーションコードなし）。設計・実装計画の最初の Issue で整備し、ここを書き換える。

  - name: test
    contents: |
      未整備（2026-10-25 時点でアプリケーションコードなし）。設計・実装計画の最初の Issue で整備し、ここを書き換える。

  - name: build
    contents: |
      未整備（2026-10-25 時点でアプリケーションコードなし）。設計・実装計画の最初の Issue で整備し、ここを書き換える。

  - name: project
    contents: |
      作業ルールは AGENTS.md、Devin 用 Playbook は devin/ を参照。
      研究目的・RQ の正本は 00_context/research-questions.md。
      旧チャットボット（v1）はタグ v1-chatbot に残っている（git show v1-chatbot:<パス> で参照可）。
